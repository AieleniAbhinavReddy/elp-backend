# Datasource Configuration (Aiven MySQL - configured via environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://elp-db-elp-db-1.j.aivencloud.com:25395/defaultdb?sslMode=REQUIRED}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pooling configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# YouTube API Key (using an environment variable)
youtube.api.key=${YOUTUBE_API_KEY:}

# JDoodle API credentials
jdoodle.client-id=${JDOODLE_CLIENT_ID:27f13775b98975e76a9e9b8c8019e0f}
jdoodle.client-secret=${JDOODLE_CLIENT_SECRET:5200af30205d27d69efe1a52ab6aa4de97ef26f07efba3c8aedb3e9a84faf37e}

# Outbound HTTP client tuning
http.client.connect-timeout-ms=5000
http.client.read-timeout-ms=10000